name: axion
description: "Axion - Simulador de Entrevistas Técnicas com IA"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1

  # Camera & Permissions
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Audio
  flutter_tts: ^4.2.0
  record: ^6.2.0

  # UI & Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.70.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
  assets:
    - .env
